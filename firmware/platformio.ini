; Firmware for the voice-controlled fairy light lamp.
;
; One environment per model. Each builds the same sources in src/ with the
; model in models/<environment name>/:
;
;   pio run -e crystal_v1_ds_cnn --target upload
;
; Without -e, the default environment below is used.
; Monitor: pio device monitor

[platformio]
default_envs = crystal_ds_cnn

[env]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 9600

; Harvard_TinyMLx brings TensorFlow Lite for Microcontrollers 2.4 with the
; CMSIS-NN kernels for the Cortex-M4.
lib_deps =
    https://github.com/tinyMLx/arduino-library

; The Arduino core builds for size (-Os). With -O2 the ds_cnn model takes 290 ms
; per inference instead of 348 ms; flash is not scarce (1 MB). A -O3 build
; flashed but printed nothing, so stay with -O2.
build_unflags = -Os
build_flags =
    -O2
    -I models/${PIOENV}
build_src_filter =
    +<*>
    +<../models/${PIOENV}/>

; Models. `uv run python -m fairy_kws.firmware <model folder>` writes
; models/<name>/ and adds the environment here.

[env:crystal_ds_cnn]

[env:crystal_v1_ds_cnn]

[env:crystal_v2_ds_cnn]

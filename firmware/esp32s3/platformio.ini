; Firmware for the ESP32-S3-DevKitC-1 with an INMP441 microphone on I2S.
;
; The board's own code is in src/: microphone (I2S), RGB LED, serial port and
; board.h. The code both boards share is in ../common, the models in
; ../models. Each model is an environment, built with ../models/<environment
; name>/ (src/CMakeLists.txt finds it from the name of the build folder):
;
;   pio run -e crystal_v1_ds_cnn --target upload
;
; Without -e, the default environment below is used.
; Monitor: pio device monitor
;
; ESP-IDF, not the Arduino core: TensorFlow Lite Micro comes from Espressif's
; esp-tflite-micro component (src/idf_component.yml) with the ESP-NN kernels
; for the ESP32-S3. sdkconfig.defaults sets 240 MHz and optimisation for speed.
;
; Pins and the microphone gain can be changed with build flags in [env], for
; example:
;   build_flags = -D RGB_LED_PIN=48 -D MIC_PIN_SCK=4 -D MIC_GAIN=64

[platformio]
default_envs = crystal_ds_cnn

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = direct

; Models. `uv run python -m fairy_kws.firmware <model folder>` writes
; ../models/<name>/ and adds the environment here and in ../nano33ble.


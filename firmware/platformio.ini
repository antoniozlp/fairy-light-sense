; Firmware for the voice-controlled fairy light lamp.
; Build:   pio run
; Flash:   pio run --target upload
; Monitor: pio device monitor

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 9600

; Harvard_TinyMLx brings TensorFlow Lite for Microcontrollers 2.4 with the
; CMSIS-NN kernels for the Cortex-M4.
lib_deps =
    https://github.com/tinyMLx/arduino-library

; The Arduino core builds for size (-Os). With -O2 the ds_cnn model takes 290 ms
; per inference instead of 348 ms; flash is not scarce (1 MB). A -O3 build
; flashed but printed nothing, so stay with -O2.
build_unflags = -Os
build_flags = -O2
